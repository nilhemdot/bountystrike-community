  mcp-politeness:
    <<: *defaults
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.mcp-python
      args:
        MCP_NAME: politeness-mcp
    image: bs-mcp-politeness:latest
    container_name: bs-mcp-politeness
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    environment:
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    deploy:
      resources:
        limits: { cpus: '0.3', memory: 256M }
    networks:
      - bountystrike

  mcp-sandbox:
    <<: *defaults
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.mcp-python
      args:
        MCP_NAME: sandbox-mcp
    image: bs-mcp-sandbox:latest
    container_name: bs-mcp-sandbox
    restart: unless-stopped
    deploy:
      resources:
        limits: { cpus: '0.5', memory: 512M }
    networks:
      - bountystrike

  mcp-kev:
    <<: *defaults
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.mcp-python
      args:
