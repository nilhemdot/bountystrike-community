# BountyStrike v5 — Solo Mode Stack
# Reference: docs/research/05-deployment.md §Solo Mode Setup / docker-compose.yml
#
# Launch (from repo root):
#   docker compose -f infra/docker/docker-compose.yml --env-file .env up -d
#
# All passwords/secrets sourced from .env (see .env.example, 21 keys).
# No hardcoded credentials — fail loudly if env unset (we use ${VAR:?...} syntax).

name: bountystrike

# ----------------------------------------------------------------------------
# YAML anchors — shared defaults applied to every service via `<<: *defaults`.
# Centralizes log rotation (default json-file driver is unbounded; ten 10MB
# files per container caps disk usage at ~30MB/service on long uptime).
# ----------------------------------------------------------------------------
x-defaults: &defaults
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:

  # --------------------------------------------------------------------------
  # postgres — custom bs-postgres:pg17 image (Postgres 17 + pgvector +
  # vectorscale + pg_search). Built from infra/docker/Dockerfile.postgres-bs.
  # ParadeDB dropped pgvectorscale from its bundle — custom image required.
  # Mounts ../sql/*.sql via /docker-entrypoint-initdb.d (auto-runs on first boot)
  # --------------------------------------------------------------------------
  postgres:
    <<: *defaults
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.postgres-bs
    image: bs-postgres:pg17
    container_name: bs-postgres
    restart: unless-stopped
    # Tuning for pgvector + Hatchet workload on a solo box.
    # shared_buffers ≈ 25% of container memory limit (512M of 2G);
    # effective_cache_size hints planner that OS cache covers ~2G;
    # work_mem 16M supports vector kNN sorts without spilling to disk;
    # random_page_cost 1.1 reflects SSD (default 4.0 assumes spinning disk).
    command:
      - postgres
      - -c
      - shared_buffers=512MB
      - -c
      - effective_cache_size=2GB
      - -c
      - work_mem=16MB
      - -c
      - maintenance_work_mem=128MB
      - -c
      - max_connections=100
      - -c
      - random_page_cost=1.1
      # pg_search (ParadeDB) MUST be preloaded — its background worker + BM25
      # index AM require the shared library at server start (Context7
      # /paradedb/paradedb §self-hosted/extension). Without this, CREATE
      # EXTENSION pg_search / BM25 indexes fail. Added for Phase 1 (01-01).
      - -c
      - shared_preload_libraries=pg_search
    environment:
      POSTGRES_USER: bs
      POSTGRES_DB: bountystrike
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Init scripts auto-execute alphabetically on first DB creation only.
      - ../sql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bs -d bountystrike"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    deploy:
      resources:
        limits: { cpus: '2', memory: 2G }
        reservations: { memory: 512M }
    networks:
      - bountystrike

  # --------------------------------------------------------------------------
  # redis — kill switch flag + cache (AOF + password)
  # Note: research/05 specifies redis:8.0-alpine; we use 7-alpine for stability
  # in Phase 0b — upgrade to 8.x in Phase 1 when GA.
  # --------------------------------------------------------------------------
  redis:
    <<: *defaults
    image: redis:7-alpine
    container_name: bs-redis
    restart: unless-stopped
    # --maxmemory caps RSS so a runaway producer can't OOM the host;
    # allkeys-lru evicts cold keys when the cap is hit (kill-switch flag
    # is the only must-keep key — set per-key TTLs for cache entries).
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --requirepass
      - ${REDIS_PASSWORD:?REDIS_PASSWORD must be set in .env}
      - --maxmemory
      - "200mb"
      - --maxmemory-policy
      - "allkeys-lru"
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $${REDIS_PASSWORD} ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    deploy:
      resources:
        limits: { cpus: '0.5', memory: 256M }
    networks:
      - bountystrike

  # --------------------------------------------------------------------------
  # hatchet-postgres — DEDICATED Postgres for the Hatchet engine.
  # Isolated from `postgres` (bs-postgres, the application DB) per plan 01-02
  # AC-8: engine state never shares a database with BountyStrike app data.
  # Pinned to the version upstream hatchet-lite ships against (postgres:15.6).
  # --------------------------------------------------------------------------
  hatchet-postgres:
    <<: *defaults
    image: postgres:15.6
    container_name: bs-hatchet-postgres
    restart: unless-stopped
    command: postgres -c 'max_connections=200'
    environment:
      POSTGRES_USER: hatchet
      POSTGRES_PASSWORD: ${HATCHET_POSTGRES_PASSWORD:-hatchet}
      POSTGRES_DB: hatchet
    volumes:
      - hatchet_lite_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d hatchet -U hatchet"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits: { cpus: '0.5', memory: 512M }
    networks:
      - bountystrike

  # --------------------------------------------------------------------------
  # hatchet — self-hosted workflow engine (hatchet-lite, V1 engine).
  # hatchet-lite bundles engine + REST API + dashboard in one container and uses
  # its dedicated Postgres (hatchet-postgres) as BOTH data store and message
  # queue — the documented minimal self-host topology. Engine data is fully
  # isolated from bs-postgres (plan 01-02 AC-8). The full external-RabbitMQ
  # topology is available upstream but unnecessary for solo mode.
  # Workflows: ScopeIngest, EVRanker, ScanJob, TriageJob, ReportJob.
  #
  # PINNED to tag v0.86.18 (matches the prior engine pin in this repo). Bump +
  # re-resolve a digest with:
  #   docker buildx imagetools inspect \
  #     ghcr.io/hatchet-dev/hatchet/hatchet-lite:<semver>
  #
  # The v1 Python SDK connects over insecure gRPC on :7077. The auth token
  # (HATCHET_CLIENT_TOKEN) embeds SERVER_GRPC_BROADCAST_ADDRESS, so a host-run
  # worker dials whatever that is set to. Default 127.0.0.1:7077 suits the solo-
  # mode host worker; an in-network deploy overrides
  # HATCHET_GRPC_BROADCAST=hatchet:7077.
  # --------------------------------------------------------------------------
  hatchet:
    <<: *defaults
    image: ghcr.io/hatchet-dev/hatchet/hatchet-lite:v0.86.18
    container_name: bs-hatchet
    restart: unless-stopped
    depends_on:
      hatchet-postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://hatchet:${HATCHET_POSTGRES_PASSWORD:-hatchet}@hatchet-postgres:5432/hatchet?sslmode=disable
      SERVER_AUTH_COOKIE_DOMAIN: localhost
      SERVER_AUTH_COOKIE_INSECURE: "t"
      SERVER_GRPC_BIND_ADDRESS: "0.0.0.0"
      SERVER_GRPC_INSECURE: "t"
      SERVER_GRPC_BROADCAST_ADDRESS: ${HATCHET_GRPC_BROADCAST:-127.0.0.1:7077}
      SERVER_GRPC_PORT: "7077"
      SERVER_URL: http://localhost:8888
      SERVER_AUTH_SET_EMAIL_VERIFIED: "t"
      SERVER_DEFAULT_ENGINE_VERSION: "V1"
      SERVER_INTERNAL_CLIENT_INTERNAL_GRPC_BROADCAST_ADDRESS: ${HATCHET_GRPC_BROADCAST:-127.0.0.1:7077}
    ports:
      - "127.0.0.1:7077:7077"   # gRPC (worker connections)
      - "127.0.0.1:8888:8888"   # HTTP API + dashboard
    volumes:
      - hatchet_lite_config:/config
    # Readiness probe endpoint verified empirically against the running
    # hatchet-lite container at APPLY time (see 01-02 SUMMARY).
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://localhost:8888/api/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 40s
    deploy:
      resources:
        limits: { cpus: '1.5', memory: 1G }
        reservations: { memory: 256M }
    networks:
      - bountystrike

  # --------------------------------------------------------------------------
  # langfuse — self-hosted LLM observability (Sonnet/Opus traces, cost track)
  # --------------------------------------------------------------------------
  langfuse:
    <<: *defaults
    # Pinned to 3.174.1 + multi-arch manifest-list digest. Bump tag +
    # re-resolve digest with:
    #   docker buildx imagetools inspect langfuse/langfuse:<semver>
    image: langfuse/langfuse:3.174.1@sha256:e54883f4535a08505e20169d51ed7cd5f8f0505294a6ba982dfa64c78edc5c0a
    container_name: bs-langfuse
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://bs:${POSTGRES_PASSWORD}@postgres:5432/bountystrike?sslmode=disable
      NEXTAUTH_SECRET: ${LANGFUSE_SECRET:?LANGFUSE_SECRET must be set in .env}
      NEXTAUTH_URL: http://localhost:3000
      SALT: ${LANGFUSE_SALT:?LANGFUSE_SALT must be set in .env}
      TELEMETRY_ENABLED: "false"
      LANGFUSE_ENABLE_EXPERIMENTAL_FEATURES: "false"
    ports:
      - "127.0.0.1:3000:3000"
    deploy:
      resources:
        limits: { cpus: '1', memory: 1G }
        reservations: { memory: 256M }
    networks:
      - bountystrike

  # --------------------------------------------------------------------------
  # control-plane — FastAPI orchestrator + Hatchet workers
  # Coordinates scan jobs, triage, reporting, evidence storage
  # --------------------------------------------------------------------------
  control-plane:
    <<: *defaults
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.control-plane
    image: bs-control-plane:latest
    container_name: bs-control-plane
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      hatchet:
        condition: service_healthy
    # FastAPI orchestrator + Hatchet workflow registration on startup.
    # uvicorn binds 0.0.0.0:8000 inside container (mapped to 127.0.0.1:8001
    # on host to avoid collision with hatchet's 8080 and langfuse's 3000).
    command:
      - uvicorn
      - control_plane.app:app
      - --host
      - "0.0.0.0"
      - --port
      - "8000"
    environment:
      DATABASE_URL: postgresql://bs:${POSTGRES_PASSWORD}@postgres:5432/bountystrike?sslmode=disable
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:?ANTHROPIC_API_KEY must be set in .env}
      # Hatchet client config — control-plane registers workflows on startup.
      # hatchet-lite serves gRPC on 7077 (V1 engine); in-network clients use
      # the service name. A host-run worker uses HATCHET_CLIENT_TOKEN instead.
      HATCHET_CLIENT_GRPC_HOST: hatchet:7077
      # JWT keypair paths for scope validation (auto-generated by entrypoint)
      SCOPE_JWT_PUBLIC_KEY_PATH: ${SCOPE_JWT_PUBLIC_KEY_PATH:-keys/scope_jwt_public.pem}
      # Evidence storage (local or r2; see .env.example §Evidence store)
      EVIDENCE_BACKEND: ${EVIDENCE_BACKEND:-local}
      EVIDENCE_ROOT: ${EVIDENCE_ROOT:-./evidence}
      # R2 vars (only used when EVIDENCE_BACKEND=r2)
      R2_BUCKET: ${R2_BUCKET:-}
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID:-}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
      R2_ENDPOINT_URL: ${R2_ENDPOINT_URL:-}
      R2_REGION: ${R2_REGION:-auto}
      # Platform API tokens for scope ingestion (optional, BYOK model)
      H1_API_TOKEN: ${H1_API_TOKEN:-}
      H1_USERNAME: ${H1_USERNAME:-}
      BUGCROWD_SESSION_COOKIE: ${BUGCROWD_SESSION_COOKIE:-}
      INTIGRITI_PAT: ${INTIGRITI_PAT:-}
      YESWEHACK_BEARER: ${YESWEHACK_BEARER:-}
      # Kill switch (Layer 1 circuit breaker)
      KILL_SWITCH_BACKEND: ${KILL_SWITCH_BACKEND:-redis}
      KILL_SWITCH_KEY: ${KILL_SWITCH_KEY:-bountystrike:killswitch:global}
      # OAST callbacks (optional, improves detection accuracy)
      INTERACTSH_SERVER_URL: ${INTERACTSH_SERVER_URL:-}
      INTERACTSH_AUTH: ${INTERACTSH_AUTH:-}
      BURP_COLLABORATOR_URL: ${BURP_COLLABORATOR_URL:-}
    ports:
      - "127.0.0.1:8001:8000"
    volumes:
      # JWT keypair (auto-generated if missing by entrypoint script)
      - ../../keys:/home/controlplane/app/keys:ro
      # Evidence store when EVIDENCE_BACKEND=local
      - ../../evidence:/home/controlplane/app/evidence
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://localhost:8000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s
    deploy:
      resources:
        limits: { cpus: '2', memory: 2G }
        reservations: { memory: 512M }
    networks:
      - bountystrike

  # --------------------------------------------------------------------------
  # caddy — reverse proxy (TLS off for solo dev; flip on for SaaS)
  # --------------------------------------------------------------------------
  caddy:
    <<: *defaults
    image: caddy:2-alpine
    container_name: bs-caddy
    restart: unless-stopped
    # Gate caddy on hatchet's readiness so cold-boot requests don't
    # 502 against an upstream that hasn't accepted traffic yet.
    # langfuse has no built-in healthcheck endpoint we trust here, so
    # service_started is the conservative gate.
    depends_on:
      hatchet:
        condition: service_healthy
      langfuse:
        condition: service_started
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    deploy:
      resources:
        limits: { cpus: '0.5', memory: 256M }
    networks:
      - bountystrike

  # --------------------------------------------------------------------------
  # MCP Servers (15 total: 14 Python + 1 Node)
  # Exposed via stdio transport to control-plane
  # --------------------------------------------------------------------------

  mcp-oracle:
    <<: *defaults
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.mcp-python
      args:
        MCP_NAME: oracle-mcp
    image: bs-mcp-oracle:latest
    container_name: bs-mcp-oracle
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://bs:${POSTGRES_PASSWORD}@postgres:5432/bountystrike?sslmode=disable
    deploy:
      resources:
        limits: { cpus: '0.3', memory: 256M }
    networks:
      - bountystrike

  mcp-ev:
    <<: *defaults
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.mcp-python
      args:
        MCP_NAME: ev-mcp
    image: bs-mcp-ev:latest
    container_name: bs-mcp-ev
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://bs:${POSTGRES_PASSWORD}@postgres:5432/bountystrike?sslmode=disable
    deploy:
      resources:
        limits: { cpus: '0.3', memory: 256M }
    networks:
      - bountystrike

  mcp-dedup:
    <<: *defaults
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.mcp-python
      args:
        MCP_NAME: dedup-mcp
    image: bs-mcp-dedup:latest
    container_name: bs-mcp-dedup
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://bs:${POSTGRES_PASSWORD}@postgres:5432/bountystrike?sslmode=disable
    deploy:
      resources:
        limits: { cpus: '0.3', memory: 256M }
    networks:
      - bountystrike

  mcp-evidence:
    <<: *defaults
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.mcp-python
      args:
        MCP_NAME: evidence-mcp
    image: bs-mcp-evidence:latest
    container_name: bs-mcp-evidence
    restart: unless-stopped
    environment:
      EVIDENCE_BACKEND: ${EVIDENCE_BACKEND:-local}
      EVIDENCE_ROOT: ${EVIDENCE_ROOT:-./evidence}
      R2_BUCKET: ${R2_BUCKET:-}
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID:-}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
      R2_ENDPOINT_URL: ${R2_ENDPOINT_URL:-}
      R2_REGION: ${R2_REGION:-auto}
    volumes:
      - ../../evidence:/home/mcp/app/evidence
    deploy:
      resources:
        limits: { cpus: '0.3', memory: 256M }
    networks:
      - bountystrike

  mcp-scope:
    <<: *defaults
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.mcp-node
      args:
        MCP_NAME: scope-mcp
    image: bs-mcp-scope:latest
    container_name: bs-mcp-scope
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://bs:${POSTGRES_PASSWORD}@postgres:5432/bountystrike?sslmode=disable
      SCOPE_JWT_PUBLIC_KEY_PATH: ${SCOPE_JWT_PUBLIC_KEY_PATH:-keys/scope_jwt_public.pem}
    volumes:
      - ../../keys:/home/mcp/app/keys:ro
    deploy:
      resources:
        limits: { cpus: '0.3', memory: 256M }
    networks:
      - bountystrike

  mcp-state:
    <<: *defaults
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.mcp-python
      args:
        MCP_NAME: state-mcp
    image: bs-mcp-state:latest
    container_name: bs-mcp-state
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://bs:${POSTGRES_PASSWORD}@postgres:5432/bountystrike?sslmode=disable
    deploy:
      resources:
        limits: { cpus: '0.3', memory: 256M }
    networks:
      - bountystrike

  mcp-normalize:
    <<: *defaults
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.mcp-python
      args:
        MCP_NAME: normalize-mcp
    image: bs-mcp-normalize:latest
    container_name: bs-mcp-normalize
    restart: unless-stopped
    deploy:
      resources:
        limits: { cpus: '0.3', memory: 256M }
    networks:
      - bountystrike

  mcp-politeness:
    <<: *defaults
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.mcp-python
      args:
        MCP_NAME: politeness-mcp
    image: bs-mcp-politeness:latest
    container_name: bs-mcp-politeness
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    environment:
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    deploy:
      resources:
        limits: { cpus: '0.3', memory: 256M }
    networks:
      - bountystrike

  mcp-sandbox:
    <<: *defaults
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.mcp-python
      args:
        MCP_NAME: sandbox-mcp
    image: bs-mcp-sandbox:latest
    container_name: bs-mcp-sandbox
    restart: unless-stopped
    deploy:
      resources:
        limits: { cpus: '0.5', memory: 512M }
    networks:
      - bountystrike

  mcp-kev:
    <<: *defaults
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.mcp-python
      args:
        MCP_NAME: kev-mcp
    image: bs-mcp-kev:latest
    container_name: bs-mcp-kev
    restart: unless-stopped
    deploy:
      resources:
        limits: { cpus: '0.3', memory: 256M }
    networks:
