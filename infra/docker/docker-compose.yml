# ============================================================================
# Named volumes (default driver = local)
# ============================================================================
volumes:
  postgres_data:
  redis_data:
  hatchet_data:
  caddy_data:
  caddy_config:

# ============================================================================
# Default bridge network — service-name DNS resolution between containers
# ============================================================================
networks:
  bountystrike:
    driver: bridge
    name: bountystrike
