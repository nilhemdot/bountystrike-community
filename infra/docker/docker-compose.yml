    container_name: bs-mcp-yeswehack
    restart: unless-stopped
    environment:
      YESWEHACK_BEARER: ${YESWEHACK_BEARER:-}
    deploy:
      resources:
        limits: { cpus: '0.3', memory: 256M }
    networks:
      - bountystrike

  mcp-immunefi:
    <<: *defaults
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.mcp-python
      args:
        MCP_NAME: immunefi-mcp
    image: bs-mcp-immunefi:latest
    container_name: bs-mcp-immunefi
    restart: unless-stopped
    deploy:
      resources:
        limits: { cpus: '0.3', memory: 256M }
    networks:
      - bountystrike

# ============================================================================
# Named volumes (default driver = local)
# ============================================================================
volumes:
  postgres_data:
  redis_data:
  # hatchet-lite (engine + dedicated Postgres) durable state — plan 01-02.
  hatchet_lite_postgres_data:
  hatchet_lite_config:
  caddy_data:
  caddy_config:

# ============================================================================
# Default bridge network — service-name DNS resolution between containers
# ============================================================================
networks:
  bountystrike:
    driver: bridge
    name: bountystrike
