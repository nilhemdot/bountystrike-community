  mcp-h1:
    <<: *defaults
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.mcp-python
      args:
        MCP_NAME: h1-mcp
    image: bs-mcp-h1:latest
    container_name: bs-mcp-h1
    restart: unless-stopped
    environment:
