apiVersion: 1

# Provider config — points Grafana at the JSON files in this directory.
# Mount this file at /etc/grafana/provisioning/dashboards/ and the JSON
# directory at /var/lib/grafana/dashboards/ (or the path below).

providers:
  - name: bountystrike-phase3
    orgId: 1
    folder: BountyStrike
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      # When mounting via docker-compose, bind this path to
      # infra/grafana/dashboards/ in the repo.
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
