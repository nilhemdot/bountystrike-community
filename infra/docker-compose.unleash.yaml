services:
  unleash-db:
    image: postgres:16
    environment:
      POSTGRES_USER: unleash
      POSTGRES_PASSWORD: unleash
      POSTGRES_DB: unleash
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U unleash -d unleash"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - unleash_pg:/var/lib/postgresql/data

  unleash:
    image: unleashorg/unleash-server:latest
    ports:
      - "4242:4242"  # admin UI + API
    depends_on:
      unleash-db:
        condition: service_healthy
    environment:
      DATABASE_URL: "postgres://unleash:unleash@unleash-db:5432/unleash"
      DATABASE_SSL: "false"
    # Default dev admin credentials: admin / unleash4all (per brief). DEV ONLY —
    # rotate before any non-local deployment.

volumes:
  unleash_pg:
