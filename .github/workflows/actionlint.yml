name: actionlint

on:
  pull_request:
    paths:
      - '.github/workflows/**'
  push:
    branches: [master]
    paths:
      - '.github/workflows/**'

permissions:
  contents: read

jobs:
  actionlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install actionlint
        id: install
        run: bash <(curl -sSL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash) 1.7.12

      - name: Install shellcheck
        run: |
          set -euo pipefail
          curl -sSL https://github.com/koalaman/shellcheck/releases/download/v0.10.0/shellcheck-v0.10.0.linux.x86_64.tar.xz | tar xJ -C "$RUNNER_TEMP"
          echo "SHELLCHECK_BIN=$RUNNER_TEMP/shellcheck-v0.10.0/shellcheck" >> "$GITHUB_ENV"
          "$RUNNER_TEMP/shellcheck-v0.10.0/shellcheck" --version | head -2

      - name: Run actionlint with shellcheck
        run: ${{ steps.install.outputs.executable }} -color -shellcheck="$SHELLCHECK_BIN"
