name: integration-pg

# Postgres + pgvector integration tests.
#
# Trigger: every push to master and every PR that touches Python sources,
# infra/sql migrations, this workflow, or the workspace lock files.
#
# Strategy:
#   1. unit job runs control-plane/tests/ in isolation - no service deps,
#      catches the 90% of regressions cheaply (<= 30s).
#   2. integration job spins a pgvector/pgvector:pg17 service container,
#      applies infra/sql/*.sql in lex order, then runs tests/integration/
#      with BS5_PG_TEST_DSN pointing at it. R2 + opt-in dedup recall stay
#      skipped (they require live secrets that this workflow does not own).
#
# The pinned setup-uv version matches r2-smoke.yml so a single bump rolls
# both forward.
#
# Security: no step interpolates user-controlled event payload. Only
# github.ref (sanitized branch ref) is read, in the concurrency group.

on:
  push:
    branches: [master]
    paths:
      - "control-plane/**"
      - "mcp/**"
      - "tests/**"
      - "infra/sql/**"
      - "scripts/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/integration-pg.yml"
  pull_request:
    paths:
      - "control-plane/**"
      - "mcp/**"
      - "tests/**"
      - "infra/sql/**"
      - "scripts/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/integration-pg.yml"

concurrency:
  group: integration-pg-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  unit:
    name: control-plane unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true
          cache-dependency-glob: |
            uv.lock
            control-plane/pyproject.toml

      - name: Run control-plane unit tests
        working-directory: control-plane
        # pytest lives in control-plane's `dev` *extra* (optional-dependencies),
        # which `uv run` does not enable by default — hence `--extra dev`.
        run: uv run --frozen --extra dev pytest -q --no-header

  integration:
    name: tests/integration on Postgres + pgvector
    runs-on: ubuntu-latest

    # NOTE: a bare `services:` container cannot be used here. The schema needs
    # the `vectorscale` + `pg_search` extensions (infra/sql/00_extensions.sql),
    # which no upstream image ships — the repo's own bs-postgres:pg17
    # (infra/docker/Dockerfile.postgres-bs) bundles them. pg_search additionally
    # requires `-c shared_preload_libraries=pg_search`, and `services:` offers no
    # way to append server args. So we build the image and `docker run` it below.

    env:
      # Tests sniff this env var; mirror compose creds so a developer
      # reproducing the failure locally can copy-paste the DSN.
      BS5_PG_TEST_DSN: postgresql://bs:bspass@127.0.0.1:5432/bountystrike_test
      PGPASSWORD: bspass

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true
          cache-dependency-glob: |
            uv.lock
            pyproject.toml
            control-plane/pyproject.toml

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build bs-postgres:pg17 (vector + vectorscale + pg_search)
        # The first build compiles pgvectorscale from Rust/pgrx source and is
        # slow; the gha cache makes subsequent runs fast. Context is the docker
        # dir only — the Dockerfile pulls all sources over the network, no repo
        # COPY, so the build context stays tiny.
        uses: docker/build-push-action@v6
        with:
          context: infra/docker
          file: infra/docker/Dockerfile.postgres-bs
          load: true
          tags: bs-postgres:pg17
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Start Postgres (bs-postgres:pg17)
        # `-c shared_preload_libraries=pg_search` is mandatory for pg_search
        # (documented on the image via LABEL bountystrike.postgres.requires).
        run: |
          docker run -d --name bs-pg -p 5432:5432 \
            -e POSTGRES_USER=bs \
            -e POSTGRES_PASSWORD=bspass \
            -e POSTGRES_DB=bountystrike_test \
            bs-postgres:pg17 \
            -c shared_preload_libraries=pg_search

      - name: Wait for Postgres to accept connections
        run: |
          for i in $(seq 1 30); do
            if docker exec bs-pg pg_isready -U bs -d bountystrike_test; then
              echo "postgres ready after ${i} attempt(s)"
              exit 0
            fi
            sleep 2
          done
          echo "postgres did not become ready in time" >&2
          docker logs bs-pg >&2 || true
          exit 1

      - name: Install psql client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -yqq --no-install-recommends postgresql-client

      - name: Apply infra/sql migrations
        # Service-container volumes can't mount the repo, so we run
        # migrations through psql instead of /docker-entrypoint-initdb.d.
        # ON_ERROR_STOP makes drift surface as a workflow failure.
        run: |
          for f in infra/sql/*.sql; do
            echo "=== applying $(basename "$f") ==="
            psql -h 127.0.0.1 -U bs -d bountystrike_test \
              -v ON_ERROR_STOP=1 -f "$f"
          done

      - name: Run schema-Pydantic contract test
        # --all-packages installs the workspace members (control_plane et al.)
        # the integration tests import; the root project depends on none of them.
        run: uv run --frozen --all-packages pytest tests/integration/test_schema_pydantic_contract.py -q --no-header

      - name: Run integration suite
        run: uv run --frozen --all-packages pytest tests/integration -q --no-header
