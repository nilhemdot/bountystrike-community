[project]
name = "sandbox-mcp"
version = "0.1.0"
description = "BountyStrike v5 — sandboxed PoC execution (FastMCP)"
requires-python = ">=3.12"
dependencies = [
    "mcp>=1.0",
    "structlog>=24",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
]

[project.scripts]
sandbox-mcp = "sandbox_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sandbox_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
