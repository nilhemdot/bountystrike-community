[project]
name = "oracle-mcp"
version = "0.1.0"
description = "BountyStrike v5 — deterministic verification oracles (FastMCP server)"
requires-python = ">=3.12"
dependencies = [
    "mcp>=1.0",
    "httpx>=0.27",
    "playwright>=1.48",
    "scipy>=1.13",
    "pydantic>=2.9",
    "structlog>=24",
    "cryptography>=43",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
    "ruff>=0.7",
]

[project.scripts]
oracle-mcp = "oracle_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/oracle_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
