[project]
name = "ev-mcp"
version = "0.1.0"
description = "BountyStrike v5 — EV-ranked program scoring (FastMCP wrapper around control-plane scoring service)"
requires-python = ">=3.12"
dependencies = [
    "mcp>=1.0",
    "asyncpg>=0.29",
    "pydantic>=2.9",
    "structlog>=24",
    "control-plane",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
]

[project.scripts]
ev-mcp = "ev_mcp.server:main"

[tool.uv.sources]
control-plane = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ev_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
