[project]
name = "scope-mcp"
version = "0.1.0"
description = "BountyStrike v5 scope-mcp — RS256 JWT scope enforcement MCP server (TypeScript)"
requires-python = ">=3.12"
dependencies = [
    "mcp>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
