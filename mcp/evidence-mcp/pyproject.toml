[project]
name = "evidence-mcp"
version = "0.1.0"
description = "BountyStrike v5 — evidence artifact storage and hash-chained audit log (FastMCP)"
requires-python = ">=3.12"
dependencies = [
    "mcp>=1.0",
    "pydantic>=2.9",
    "aiosqlite>=0.20",
    "structlog>=24",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
]

[project.scripts]
evidence-mcp = "evidence_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/evidence_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
