  phase_gates: [099, 199, 299, 399, 499]
  bands:
    phase_0_1: "000-099 (foundation + CE MVP / verifier moat)"
    phase_2:   "100-199 (full agent fleet, anti-slop, benchmarks)"
    phase_3:   "200-299 (Solo SaaS / Cloud)"
    phase_4:   "300-399 (Enterprise / AEV)"
    phase_5:   "400-499 (Sovereign / Government)"

# ----------------------------------------------------------------------------
# CRITICAL PATH (longest real-world chain)
# ----------------------------------------------------------------------------
# The pure task-DAG critical path runs:
#   000 -> 010 -> 023 -> 024 -> 040 -> 041 -> 100 -> 160 -> 170 -> 180 -> 184
#       -> (210) -> 220 -> 221 -> 225 -> 299 -> 300 -> 340 -> 350 -> 399
#       -> 410 -> 411 -> 412 -> 499
#
# BUT the binding real-world constraint is the SOC 2 TIME GATE, not task count:
#   200-soc2-observation-start (Phase 3, ~Week 19)
#     --> [3-month minimum observation window runs in background] -->
#   310-soc2-report-delivery (Phase 4, ~Week 31+)
#   This chain gates ALL enterprise sales. It is the true long pole.
#   Mitigation: ship a SOC 2 Type I bridge report the moment controls exist,
#   then deliver Type II when the window closes.
#
# NON-AUTOMATABLE GATES (require human --resume checkpoints):
#   200  gate:time      SOC 2 observation window opens (engage auditor Wk19)
#   310  gate:time      SOC 2 report lands after window closes
#   320  gate:human     real enterprise IdP needed to test SSO end-to-end
#   330  gate:human     tenant KMS key material needed
#   400  gate:external  FedRAMP 20x Moderate window (targeted Q3 2026)
#   440  gate:external  OSS maintainer partnership process (can start @ Phase 2)
#   441  gate:external  maintainer agreements signed externally
#   025  gate:human     interactsh server domain ownership / DNS delegation
#   031  gate:human     interactsh OAST domain (shared with 025)
# ----------------------------------------------------------------------------

