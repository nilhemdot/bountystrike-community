# ============================================================================
# BountyStrike v6 — Master Task Manifest
# ============================================================================
# Version: 6.0.0
# Date: 2026-05-21
# Spans: Phase 0 through Phase 5 (task IDs 000-442 + phase gates)
# Purpose: Single executable dependency DAG for one-shot Claude Code execution.
#
# EXECUTION CONTRACT (read before running):
#   1. Lead agent loads this manifest and populates TodoWrite with every task id.
#   2. Start in --permission-mode plan; switch to acceptEdits after review.
#   3. Walk tasks in topological order of `depends_on`. A task is runnable
#      only when ALL its dependencies are `completed`.
#   4. Each task is idempotent: its script runs the `acceptance` check first
#      and exits 0 immediately if already green. Re-running the graph is a no-op.
#   5. A task is `completed` only when its acceptance command exits 0.
#   6. A Stop hook blocks session completion until every task is `completed`,
#      EXCEPT tasks marked `gate: external` or `gate: time` (see below).
#   7. Full per-task spec (files_created, acceptance commands, prose) lives in
#      tasks/<id>/task.yaml — this manifest is the DAG + metadata index.
#
# GATE TYPES:
#   gate: none      -> normal automatable task (default)
#   gate: time      -> blocked by a real-world clock, not by effort
#   gate: external  -> blocked by a third-party/process window; agent prepares
#                      artifacts but cannot force completion
#   gate: human     -> requires explicit human sign-off at a checkpoint
#
# The one-shot will require human --resume checkpoints at every gate:time,
# gate:external, and gate:human boundary. These are NOT failures; they are
# designed pause points.
# ============================================================================

meta:
  project: bountystrike-v6
