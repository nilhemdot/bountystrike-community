[project]
name = "bountystrike-v5"
version = "0.1.0"
description = "BountyStrike v5 — Claude Code-native autonomous bug bounty platform"
requires-python = ">=3.12"

[tool.uv.workspace]
members = [
    "control-plane",
    "mcp/oracle-mcp",
    "mcp/evidence-mcp",
    "mcp/dedup-mcp",
    "mcp/kev-mcp",
    "mcp/ev-mcp",
    "mcp/bugcrowd-mcp",
    "mcp/h1-mcp",
    "mcp/immunefi-mcp",
    "mcp/intigriti-mcp",
    "mcp/normalize-mcp",
    "mcp/politeness-mcp",
    "mcp/sandbox-mcp",
    "mcp/scope-mcp",
    "mcp/state-mcp",
    "mcp/yeswehack-mcp",
]

[tool.uv.sources]
oracle-mcp = { workspace = true }

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "ASYNC"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: integration tests requiring live services (Postgres, OpenAI, R2)",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.12",
    "import-linter~=2.3",
]

[tool.importlinter]
root_packages = ["control_plane"]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "community must not import enterprise"
type = "forbidden"
source_modules = ["control_plane"]
forbidden_modules = ["bountystrike_enterprise"]

[[tool.importlinter.contracts]]
name = "core must not import enterprise"
type = "forbidden"
source_modules = ["control_plane.core"]
forbidden_modules = ["bountystrike_enterprise"]
