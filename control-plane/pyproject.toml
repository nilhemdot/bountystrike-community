[project]
name = "control-plane"
version = "0.1.0"
description = "BountyStrike v5 control plane — FastAPI orchestrator + workers"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "pydantic>=2.9",
    "pyjwt[crypto]>=2.9",
    "httpx>=0.27",
    "asyncpg>=0.29",
    "sqlalchemy[asyncio]>=2.0",
    "pgvector>=0.3",
    "uvicorn[standard]>=0.32",
    "anthropic>=0.39",
    "structlog>=24.4",
    "aioboto3>=13.0",
    "redis>=5.0",
    "scipy>=1.13",
    "openfeature-sdk>=0.7",
    # Hatchet v1 function-based SDK — durable workflow runtime (plan 01-02).
    # PINNED per pin-doctrine. v1 `@hatchet.task` API is the 1.x line
    # (0.x = legacy class-decorator API); CLAUDE.md trap #2 requires >=1.33.5.
    "hatchet-sdk==1.33.6",
]

[project.optional-dependencies]
unleash = ["UnleashClient>=6.0"]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "ruff>=0.7",
    "mypy>=1.13",
    "respx>=0.21",
    "aiosqlite>=0.20",
    # moto[server] gives ThreadedMotoServer — a real local S3 endpoint that
    # aioboto3/aiobotocore reach over HTTP. moto's in-process mock_aws does NOT
    # reliably intercept aiobotocore (it bypasses botocore's HTTP layer), so the
    # R2 byte-fidelity round-trip (plan 01-03 AC-1) points the client at the
    # threaded server instead.
    "moto[server]>=5.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    "integration: integration tests requiring live services (Postgres, OpenAI, R2)",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/control_plane"]
